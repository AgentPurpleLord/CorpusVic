# The Evidence Act numbers its Parts by Chapter -- "Part 1.1", "Part 3.2"
# -- instead of the roman-numeral "Part I" style most other Victorian Acts
# use, exactly as the Criminal Procedure Act does. The default "part"
# pattern's number character class ([A-Z0-9]+[A-Z]?) has no room for the
# "." in "3.2", so all 14 of this Act's Parts fell through to generic
# heading_group nodes instead of real "part" ones -- "Part 3.2—Hearsay",
# "Part 3.11—Discretions to exclude evidence" -- leaving every Section in
# the Act with no Part above it in the hierarchy.
#
# This only widens the number's character class (letters/digits/dots
# instead of just letters/digits); the rest of the pattern, and its two
# capture groups, are unchanged from the default.
part: '^Part\s+([\dA-Z.]+)\s*[—–-]\s*(.+)$'
