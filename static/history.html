<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../static/admin/history.css">
</head>
<body>
<header>
  <h1>History review &mdash; <span id="work"></span></h1>
  <span class="counts" id="counts"></span>
  <span style="flex:1"></span>
  <select id="step-filter" class="btn"></select>
  <span id="filters">
    <button class="btn on" data-filter="undecided">Undecided</button>
    <button class="btn" data-filter="evidence">With an Act</button>
    <button class="btn" data-filter="confirmed">Confirmed</button>
    <button class="btn" data-filter="denied">Denied</button>
    <button class="btn" data-filter="all">All</button>
    <button class="btn" data-filter="unnoted" title="Changes with no margin note in the later version: taken to be the parser reading the two versions differently, and not up for review">No margin note</button>
  </span>
  <button class="btn" id="fetch-versions" title="Every version legislation.vic.gov.au holds of this Act, to fetch and parse">Fetch versions&hellip;</button>
  <button class="btn" id="fetch-acts" title="Download the Acts that amended this one between the versions held, and read their instructions">Fetch amending Acts</button>
  <button class="btn" id="slim-all">Keep versions slim</button>
  <small id="slim-state" class="none"></small>
  <a class="btn" href="../../">Dashboard</a>
  <div id="versions-panel" hidden></div>
  <pre id="log"></pre>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><p class="none">Loading the changes between versions&hellip;</p></div>
</main>
<div id="toast"></div>
<script>
// History review: every change between consecutive versions, one
// sub-provision at a time, for a person to confirm as Parliament's or
// deny as the parser's. Only confirmed changes reach the public
// histories (corpus/history). Keys: c confirm, d deny, u undo, j/k next
// and previous.
const WORK = decodeURIComponent(location.pathname.split("/").filter(Boolean).slice(-1)[0]);
const API = `../../api/works/${encodeURIComponent(WORK)}`;
let DATA = null, shown = [], current = 0, filter = "undecided", step = "";
try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}

function esc(t) { return String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toast(msg, bad) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.background = bad ? "#ae1800" : ""; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = "none"; }, 2500);
}
// A reply that isn't JSON -- a proxy's error page, a server's bare
// "Internal Server Error" -- says so with its own words, rather than as
// the browser's complaint about parsing it.
async function jsonOf(res) {
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch {
    throw new Error(`${res.status} ${res.statusText}: ${text.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 200)}`);
  }
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}
const slugOf = (v) => (DATA.versions.find((x) => x.version === v) || {}).slug;

async function load() {
  try { DATA = await jsonOf(await fetch(API + "/history")); }
  catch (e) { document.getElementById("detail").textContent = e.message; return; }
  document.getElementById("work").textContent = DATA.title || WORK;
  paintSlim();
  // Steps that could not be worked out: the rest still load, and these
  // say why, to be passed on.
  if ((DATA.errors || []).length) {
    document.getElementById("log").textContent = DATA.errors.map((e) =>
      (e.from != null ? `v${e.from} → v${e.to} could not be compared: ` : "") + e.error).join("\n");
  }
  const steps = [...new Set(DATA.items.map((i) => `${i.from}→${i.to}`))];
  document.getElementById("step-filter").innerHTML = `<option value="">All steps</option>`
    + steps.map((s) => `<option value="${s}">v${s.replace("→", " → v")}</option>`).join("");
  render(true);
}

// "repeal" is a section gone with its row of stars printed in its place
// (corpus/history/changes.py): the Act's own word for it, not "removed".
const OP_WORDS = { insert: "inserted", delete: "removed", repeal: "repealed" };

// Only a change the Act itself records -- a margin note new in the later
// version -- is up for review. Anything else is taken to be the parser
// reading the two versions differently, kept aside under its own filter.
function matches(i) {
  if (step && `${i.from}→${i.to}` !== step) return false;
  if (filter === "unnoted") return !i.noted;
  if (!i.noted) return false;
  if (filter === "all") return true;
  if (filter === "undecided") return !i.decision;
  if (filter === "evidence") return i.instructions.length > 0;
  return i.decision === filter;
}

function render(reset) {
  const was = shown[current];
  shown = DATA.items.filter(matches);
  current = reset ? 0 : Math.max(0, Math.min(shown.indexOf(was) >= 0 ? shown.indexOf(was) : current, shown.length - 1));
  const noted = DATA.items.filter((i) => i.noted);
  const n = (d) => noted.filter((i) => i.decision === d).length;
  document.getElementById("counts").textContent =
    `${noted.length} changes with a margin note: ${n(null) + n(undefined)} undecided, ${n("confirmed")} confirmed, `
    + `${n("denied")} denied; ${DATA.items.length - noted.length} without one, taken as the parser's`;
  document.getElementById("list").innerHTML = shown.map((i, k) => `
    <div class="row${k === current ? " active" : ""}" data-k="${k}">
      <span class="dot ${i.decision || ""}"></span>
      <div><strong>${esc(i.section)}${i.piece === "heading" ? " heading" : i.piece === "whole" ? "" : esc(i.label)}</strong>
        <small>v${i.from} &rarr; v${i.to} &middot; ${esc(OP_WORDS[i.op] || "changed")}
        ${i.instructions.length ? '<span class="ev">&middot; Act</span>' : ""}</small></div>
    </div>`).join("") || `<p class="none" style="padding:10px">Nothing here.</p>`;
  showItem();
}

// One version: its wording, and under it its printed pages, scrolled to
// the piece -- the two side by side, earlier on the left.
function side(key, html, v) {
  return `<div class="side"><div class="col"><div class="head">Version ${v}</div>`
    + (html != null ? `<div class="text">${html}</div>` : `<div class="text none">Not in this version</div>`) + `</div>
    <div class="pdf"><div class="pdf-bar">Version ${v} PDF
      <button class="btn" onclick="turn('${key}', -1)" title="Earlier page">&larr;</button>
      <span id="${key}-label"></span>
      <button class="btn" onclick="turn('${key}', 1)" title="Later page">&rarr;</button>
      <span style="flex:1"></span>
      <button class="btn" onclick="zoom(-1)" title="Zoom out">&minus;</button>
      <button class="btn" onclick="zoom(1)" title="Zoom in">+</button></div>
      <div class="pdf-scroll" id="${key}-scroll"></div></div></div>`;
}

function showItem() {
  const detail = document.getElementById("detail");
  const i = shown[current];
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("active", Number(r.dataset.k) === current));
  if (!i) { detail.innerHTML = `<p class="none">Nothing left in this view.</p>`; return; }
  const status = { matched: "made here", elsewhere: "found here, though the Act names another piece",
                   earlier: "already in the earlier version", "not found": "not found in this change",
                   unchecked: "not checked automatically" };
  const acts = i.instructions.map((a) => `<div class="instr ${a.status.replace(" ", "-")}">
      <strong>No. ${esc(a.act)} ${esc(a.provision)}</strong> &mdash; ${esc(a.raw)}
      <div class="none">${esc(status[a.status] || a.status)}${a.here ? "" : " (for another piece of this section)"}</div>
      ${a.place_as ? `<button class="btn place" data-node="${esc(a.node_id)}" data-reference="${esc(a.place_as)}">Make this ${esc(a.place_as)} in v${i.to}</button>` : ""}</div>`).join("");
  const notes = i.notes.map((n) => `<div class="note">${esc(n)}</div>`).join("");
  const decided = i.decision ? `<span class="decided">${i.decision === "confirmed" ? "Confirmed: shown publicly" : "Denied: a parsing issue, not shown"}</span>
      <button class="btn" onclick="decide(null)">Undo (u)</button>` : "";
  detail.innerHTML = `
    <h2>${esc(i.section)}${i.piece === "heading" ? " heading" : i.piece === "whole" ? ` ${esc(OP_WORDS[i.op] || "removed")}` : esc(i.label)}</h2>
    <div class="step">Version ${i.from} &rarr; Version ${i.to}</div>
    <div class="decide">
      <button class="btn primary" onclick="decide('confirmed')">Confirm change (c)</button>
      <button class="btn" onclick="decide('denied')">Deny: parsing issue (d)</button>
      ${decided}
    </div>
    <div class="cols">${side("old", i.old_html, i.from)}${side("new", i.new_html, i.to)}</div>
    <div class="decide">${[i.from, i.to].map((v) => slugOf(v) ? `<a class="btn" target="_blank" rel="noopener"
        href="../../?reparse=${encodeURIComponent(slugOf(v))}&mode=keep"
        title="The dashboard's Parse Menu for this version, keeping what is approved">Re-parse v${v}&hellip;</a>` : "").join(" ")}</div>
    <div class="evidence">
      <h3>Amending Acts</h3>${acts || '<div class="none">No fetched amending Act gives an instruction for this.</div>'}
      <h3>Margin notes new in Version ${i.to}</h3>${notes || '<div class="none">None.</div>'}
    </div>`;
  showPdf("old", i.from, i.old_at);
  showPdf("new", i.to, i.new_at);
}

const ZOOMS = [1, 1.5, 2, 2.5];
let pdfZoom = 1;
try { pdfZoom = ZOOMS.includes(Number(localStorage.getItem("historyPdfZoom"))) ? Number(localStorage.getItem("historyPdfZoom")) : 1; } catch {}
const panes = {};
const docs = (slug) => `../../api/docs/${encodeURIComponent(slug)}`;

// Where the piece is printed: the parse's own boxes, or -- for a parse
// made before parses recorded them -- its opening words found on its pages.
async function marks(slug, at) {
  if (at.rects && at.rects.length) return at.rects;
  if (at.found) return at.found;
  at.found = [];
  for (let p = at.page; at.text && p <= Math.min(at.page_end || at.page, at.page + 2); p++) {
    try { at.found = (await jsonOf(await fetch(`${docs(slug)}/pages/${p}/find?q=${encodeURIComponent(at.text)}`))).rects; }
    catch { break; }
    if (at.found.length) break;
  }
  return at.found;
}

// The page with the piece and one either side, one under another, scrolled
// so the piece sits near the top of the pane.
async function showPdf(key, v, at, page) {
  const scroll = document.getElementById(`${key}-scroll`);
  const label = document.getElementById(`${key}-label`);
  if (!scroll) return;
  const slug = slugOf(v);
  page = page || (at && at.page);
  const pane = panes[key] = { v, at, page };
  if (!slug || !page) {
    label.textContent = "";
    scroll.innerHTML = `<div class="none">Not in Version ${v}.</div>`;
    return;
  }
  let size, hl;
  try {
    size = await jsonOf(await fetch(`${docs(slug)}/pages/${page}`));
    hl = at ? await marks(slug, at) : [];
  } catch (e) { scroll.innerHTML = `<div class="none">${esc(e.message)}</div>`; return; }
  if (panes[key] !== pane) return;   // moved on while this loaded
  pane.count = size.page_count;
  // A piece this version hasn't got is shown where it would be: an
  // insertion or a repeal is judged against both printed versions too.
  label.textContent = (at && at.absent ? `Not in Version ${v}: where it would be, ` : "") + `page ${page} of ${size.page_count}`;
  label.classList.toggle("absent", Boolean(at && at.absent));
  const pages = [page - 1, page, page + 1].filter((p) => p >= 1 && p <= size.page_count);
  scroll.innerHTML = pages.map((p) => `<div class="stage" data-page="${p}"
      style="width: ${pdfZoom * 100}%; aspect-ratio: ${size.width} / ${size.height}">
      <img src="${docs(slug)}/pages/${p}.png?zoom=${pdfZoom}" alt="Version ${v}, page ${p}"
        onerror="this.parentElement.insertAdjacentHTML('beforeend', '<div class=&quot;none&quot; style=&quot;position:absolute;top:40%;width:100%;text-align:center&quot;>This page could not be drawn.</div>')">
      <svg preserveAspectRatio="none" viewBox="0 0 ${size.width} ${size.height}">${hl.filter((r) => r.page === p).map((r) =>
        `<rect class="hl" x="${r.x0}" y="${r.y0}" width="${r.x1 - r.x0}" height="${r.y1 - r.y0}"></rect>`).join("")}</svg>
      <span class="pno">page ${p}</span></div>`).join("");
  requestAnimationFrame(() => {
    const target = scroll.querySelector(`.stage[data-page="${page}"]`);
    const first = hl.find((r) => r.page === page);
    const y = target.offsetTop + (first ? first.y0 / size.height * target.clientHeight : 0);
    scroll.scrollTop = Math.max(0, y - scroll.clientHeight / 4);
    scroll.scrollLeft = first ? Math.max(0, target.offsetLeft + first.x0 / size.width * target.clientWidth - 20) : 0;
  });
}

function turn(key, by) {
  const p = panes[key];
  if (p && p.count && p.page + by >= 1 && p.page + by <= p.count) showPdf(key, p.v, p.at, p.page + by);
}

function zoom(by) {
  pdfZoom = ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, ZOOMS.indexOf(pdfZoom) + by))];
  try { localStorage.setItem("historyPdfZoom", String(pdfZoom)); } catch {}
  for (const key of ["old", "new"]) if (panes[key]) showPdf(key, panes[key].v, panes[key].at, panes[key].page);
}

async function decide(decision) {
  const i = shown[current];
  if (!i) return;
  const res = await fetch(API + "/history/decide", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provision: i.provision, from_version: i.from, to_version: i.to, piece: i.piece, decision }),
  });
  if (!res.ok) { toast("Couldn't save that.", true); return; }
  i.decision = decision;
  toast(decision === "confirmed" ? "Confirmed." : decision === "denied" ? "Denied." : "Undone.");
  // Move on only from a view the decision takes this change out of.
  if (decision && !matches(i)) { shown.splice(current, 1); current = Math.min(current, shown.length - 1); render(false); }
  else render(false);
}

document.getElementById("list").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (row) { current = Number(row.dataset.k); render(false); }
});
document.getElementById("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.filter;
  document.querySelectorAll("#filters .btn").forEach((x) => x.classList.toggle("on", x === b));
  render(true);
});
document.getElementById("step-filter").onchange = (e) => { step = e.target.value; render(true); };
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, select, textarea")) return;
  if (e.key === "c") decide("confirmed");
  else if (e.key === "d") decide("denied");
  else if (e.key === "u") decide(null);
  else if (e.key === "j" && current < shown.length - 1) { current++; render(false); }
  else if (e.key === "k" && current > 0) { current--; render(false); }
});
document.getElementById("fetch-acts").onclick = async (e) => {
  const btn = e.target;
  btn.disabled = true; btn.textContent = "Fetching...";
  const log = document.getElementById("log");
  try {
    const data = await jsonOf(await fetch(`../../api/acts/${encodeURIComponent(WORK)}/amending`, { method: "POST" }));
    log.style.display = "block";
    log.textContent = data.log || data.detail || "";
    await load();
  } catch (err) { toast(String(err), true); }
  finally { btn.disabled = false; btn.textContent = "Fetch amending Acts"; }
};
// Putting a piece where the Act says it is, in the later version: its
// review server's place tool, by the piece's name, so its type, number
// and position all follow from the one reference.
document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".place");
  if (!btn) return;
  const item = shown[current];
  btn.disabled = true;
  try {
    const res = await fetch(`../../review/${encodeURIComponent(slugOf(item.to))}/api/named/${encodeURIComponent(btn.dataset.node)}/place`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reference: btn.dataset.reference, after_node_index: null }),
    });
    const data = await jsonOf(res);
    toast(data.matches ? `Now ${data.reference}, as the Act says.`
      : `Placed, but it reads as ${data.reference || "unnumbered"} there -- check it in review.`, !data.matches);
    await load();
  } catch (err) { toast(err.message, true); btn.disabled = false; }
});

// The site's list of versions, newest first, those held already ticked.
// Each ticked one is fetched and parsed in turn, one request apiece, so
// the log says how far a long list has got.
document.getElementById("fetch-versions").onclick = async () => {
  const panel = document.getElementById("versions-panel");
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  panel.textContent = "Asking legislation.vic.gov.au\u2026";
  try {
    const data = await jsonOf(await fetch(API + "/versions/available"));
    panel.innerHTML = `<div class="vlist">${data.versions.slice().reverse().map((v) => `<label>
        <input type="checkbox" value="${v.version}" data-held="${v.held ? 1 : ""}" ${v.pdf_url ? "" : "disabled"}>
        v${v.version} <small>${esc(v.effective || "")}${v.held ? " &middot; held" : v.note ? ` &middot; ${esc(v.note)}` : ""}</small>
        ${v.pdf_missing ? `<small class="missing">&middot; PDF missing</small>` : ""}
      </label>`).join("")}</div>
      <div class="decide"><button class="btn primary" id="fetch-ticked">Fetch and parse the ticked versions</button>
        <button class="btn" id="fetch-all" ${data.versions.some((v) => v.pdf_url && !v.held) ? "" : "disabled"}>Fetch every version not held</button>
        <small class="none">A held version ticked is fetched again: its PDF replaced and re-parsed, keeping what you have approved.</small></div>`;
    document.getElementById("fetch-ticked").onclick = fetchTicked;
    document.getElementById("fetch-all").onclick = fetchAll;
  } catch (e) { panel.textContent = e.message; }
};

async function fetchTicked(e) {
  const ticked = [...document.querySelectorAll("#versions-panel input:checked:not(:disabled)")]
    .map((i) => ({ v: Number(i.value), again: !!i.dataset.held })).sort((a, b) => a.v - b.v);
  if (!ticked.length) { toast("Tick the versions to fetch first.", true); return; }
  e.target.disabled = true;
  const log = document.getElementById("log");
  log.style.display = "block";
  log.textContent = "";
  for (const [n, { v, again }] of ticked.entries()) {
    log.textContent += `v${v} (${n + 1} of ${ticked.length}): ${again ? "fetching again" : "downloading"} and parsing\u2026\n`;
    try {
      let job = await jsonOf(await fetch(`${API}/versions/fetch/${v}${again ? "?replace=true" : ""}`, { method: "POST" }));
      while (job.state === "running") {
        await new Promise((r) => setTimeout(r, 3000));
        job = await jsonOf(await fetch(`${API}/versions/fetch`));
      }
      if (job.state === "failed") throw new Error(job.error);
      const data = job.result;
      log.textContent += data.ok ? `v${v}: parsed as ${data.slug}\n` : `v${v}: the parse failed\n${data.log || ""}\n`;
    } catch (err) { log.textContent += `v${v}: ${err.message}\n`; }
  }
  e.target.disabled = false;
  document.getElementById("versions-panel").hidden = true;
  await load();
}

// Every version the site has and this work lacks, fetched by the server
// in one job that carries on if this page is closed; reopening the page
// picks its progress up again (followFetchAll below).
async function fetchAll(e) {
  e.target.disabled = true;
  try {
    await jsonOf(await fetch(`${API}/versions/fetch-all`, { method: "POST" }));
    document.getElementById("versions-panel").hidden = true;
    await followFetchAll();
  } catch (err) { toast(err.message, true); e.target.disabled = false; }
}

// Every version but the one reviewed in full cut down to what its margin
// notes say changed (corpus/history/slim.py), by the server. In the header,
// not the Fetch versions panel: that panel is only built once the site
// answers, and the button was lost inside it.
function paintSlim() {
  const btn = document.getElementById("slim-all");
  const whole = DATA.versions.filter((v) => v.version !== DATA.base && !DATA.slim.includes(v.version));
  document.getElementById("slim-state").textContent = DATA.base == null ? ""
    : `Base v${DATA.base} \u00b7 ${DATA.slim.length} slim`;
  btn.disabled = !whole.length;
  btn.title = whole.length
    ? `Parse ${whole.map((v) => "v" + v.version).join(", ")} again, then keep only what each one's margin notes say `
      + `changed, and those pages of its PDF -- the rest read from v${DATA.base}, the version reviewed in full`
    : `Every version but the base (v${DATA.base}) is kept slim already`;
}
document.getElementById("slim-all").onclick = slimAll;

async function slimAll(e) {
  if (!confirm(`Parse each version held whole again, then keep only the pieces its margin notes say changed, `
             + `and only those pages of its PDF? The rest is read from v${DATA.base}, the version you review in full. `
             + "A version can be fetched again whole at any time.")) return;
  e.target.disabled = true;
  try {
    await jsonOf(await fetch(`${API}/slim`, { method: "POST" }));
    await followSlim();
  } catch (err) { toast(err.message, true); e.target.disabled = false; }
}

async function followSlim() {
  const log = document.getElementById("log");
  let job;
  try { job = await jsonOf(await fetch(`${API}/slim`)); } catch { return; }
  log.style.display = "block";
  document.getElementById("slim-all").disabled = true;
  try {
    while (job.state === "running") {
      log.textContent = `Keeping versions slim: ${job.at || "starting"}\u2026 This carries on if you close the page.`;
      await new Promise((r) => setTimeout(r, 5000));
      job = await jsonOf(await fetch(`${API}/slim`));
    }
    if (job.state === "failed") throw new Error(job.error);
    const vs = Object.entries(job.report.versions);
    log.textContent = `Base: v${job.report.base}.\n` + vs.map(([v, r]) =>
      `v${v}: keeps ${r.text} changed piece(s), ${r.pages} page(s); parse ${Math.round(r.bytes_before / 1024)} KB \u2192 ${Math.round((r.bytes_after || 0) / 1024)} KB`
      + (r.missing.length ? `; fetch it again for: ${r.missing.join(", ")}` : "")).join("\n");
  } catch (err) { toast(err.message, true); }
  await load();
}

async function followFetchAll() {
  const log = document.getElementById("log");
  let job;
  try { job = await jsonOf(await fetch(`${API}/versions/fetch`)); } catch { return; }
  if (!job.all) return;
  log.style.display = "block";
  while (true) {
    const done = job.done.length + job.failed.length;
    log.textContent = (job.state === "running"
        ? `Fetching every version: v${job.version} (${done + 1} of ${job.all.length})\u2026 This carries on if you close the page.\n`
        : `Fetched ${job.done.length} of ${job.all.length} versions.\n`)
      + job.failed.map((f) => `v${f.version}: ${f.error}\n`).join("");
    if (job.state !== "running") break;
    await new Promise((r) => setTimeout(r, 5000));
    try { job = await jsonOf(await fetch(`${API}/versions/fetch`)); } catch { return; }
  }
  await load();
}

load().then(() => {
