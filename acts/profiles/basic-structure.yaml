# Page 1 sets out: Act Title and Date of Royal Assent. 
# Sometimes before the table of provisions, there might be extra information such as an 'introductory note'
# Table of provisions will follow this.
# 
# STRUCTURE OF AN ACT
# 
# An Act can be divided (but sometimes certain parts are skipped) in the following:
# Level One: 'Chapters', e.g. 'Chapter 1—Preliminary', centered font, larger, top of a new page, bold, em-dash.
# Level Two: 'Parts', e.g. 'Part 1.1—Formal matters', centered font, larger, top of a new page, bold, em-dash, follows chapter numbers, e.g. 1.1, 1.2, etc.
# Level Three: 'Divisions', e.g. 'Division 1—Summons or warrant to arrest', centered font, larger, bold, em-dash.
# Level Four: 'Sub-divisions', e.g. '(1) Probation officers', bold, italics, normal size, indepdenent from other elements, avoided if possible by the drafter.
#
# Sections exist globally within an Act, always increasing as the Act goes on and have the 'body text' of an Act.
# Many Acts include Schedules, which appear at the end of an Act and 'hang off' a section. They often have their own numbering. 
#
# STRUCTURE OF A SECTION
# 
# Indentation increases for each level. There is a branching structure as follows. 
#
# Level One: 'Sections', e.g. '12 Competence and compellability', bold, section number, heading. No rules about length. 
# Level Two(a): 'Paragraphs', e.g. '(a) relate to bail; or'
# Level Three(a): 'Subparagraphs', e.g. '(i) this is a sub-paragraph'
# Level Four(a): 'Sub-subparagraphs', e.g. '(A) this is a sub-subparagraph'
#
# Level One: 'Sections', e.g. '12 Competence and compellability', bold, section number, heading. No rules about length. 
# Level Two(b): '(1) This Part and the Dictionary...'
# Level Three(b): 'Paragraphs', e.g. '(a) relate to bail; or'
# Level Four(b): 'Subparagraphs', e.g. '(i) this is a sub-paragraph'
# Level Five(b): 'Sub-subparagraphs', e.g. '(A) this is a sub-subparagraph'
#
# Sub-subparagraphs are normally avoided, but can appear.
#
# NUMBERING SYSTEM
#
# The numbering system has a standard:
# sections—1, 2, 3 etc.
# subsections—(1), (2), (3) etc.
# paragraphs—(a), (b), (c) etc.
# subparagraphs—(i), (ii), (iii) etc.
# sub-subparagraphs—(A), (B), (C) etc. (these are avoided if possible).
#
# Schedules—1, 2, 3 etc.
# amending items—1, 2, 3 etc.
# non-amending clauses (other than in a treaty or agreement)—these are numbered in the same way as sections.
# provisions of a treaty or agreement—these are numbered in exactly the same way as in the original treaty or agreement.
# 
# The insertion of new provisions by amendments, or the repeal of provisions, will upset the neat, sequential numbering of an Act. If a new provision is inserted between 2 
# existing provisions, it will be given the number of the first provision, plus a letter of the alphabet (generally A). For example, a new subsection between (1) and (2) 
# will be (1A), and a new paragraph between (b) and (c) will be (ba). Sometimes multiple amendments mean that the numbering becomes rather unwieldy—the Building Act 1993 
# contains a section numbered 221ZZZBA.
# 
# On the other hand, a repeal may leave a gap in the numbering.
