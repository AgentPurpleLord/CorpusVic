# The Criminal Procedure Act numbers its Parts by Chapter -- "Part 5.1",
# "Part 4.6A" -- instead of the roman-numeral "Part I" style most other
# Victorian Acts use. The default "part" pattern's number character class
# ([A-Z0-9]+[A-Z]?) has no room for the "." in "5.1", so every one of
# these Parts fell through to a generic heading_group node instead of a
# real "part" -- e.g. "Part 2.1—Ways in which a criminal proceeding is
# commenced" or "Part 4.6A—Early committal for trial in Supreme Court".
#
# This only widens the number's character class (letters/digits/dots
# instead of just letters/digits) -- the rest of the pattern, and its two
# capture groups, are unchanged from the default.
part: '^Part\s+([\dA-Z.]+)\s*[—–-]\s*(.+)$'
