# What search is supposed to find.
#
# Each entry is a query somebody might really type and the provision it
# should lead them to. The point is not that every one reaches rank 1 --
# some are genuinely hard -- but that the number is a number. Relevance
# work is the kind you cannot feel your way through: every change here
# helps some queries and hurts others, and without a set like this the
# only evidence is whichever query you happened to try last.
#
# Scored by mean reciprocal rank (see tests/test_search_relevance.py):
# rank 1 scores 1.0, rank 2 scores 0.5, rank 10 scores 0.1, and not in
# the first 20 scores nothing.
#
# `doc` is the site slug and `page` the section page id, because those
# are stable -- a heading can be re-parsed, and a rank should not change
# because somebody fixed a typo in an Act.
#
# Add to this file whenever a search disappoints you. That is the whole
# maintenance story, and it is worth more than any amount of tuning.

- query: definition of family violence
  doc: family-violence-protection-act-2008
  page: s5
  note: >
    The query that prompted all of this. Section 5 is headed "Meaning of
    family violence" and contains the word "definition" nowhere, so no
    amount of ranking finds it -- only a vocabulary that knows the two
    words mean the same thing here.

- query: what is family violence
  doc: family-violence-protection-act-2008
  page: s5
  note: >
    The same question in the form most people actually type it. Needs
    the intent to be read, not just the words matched.

- query: what is a family member
  doc: family-violence-protection-act-2008
  page: s8

- query: meaning of family violence
  doc: family-violence-protection-act-2008
  page: s5
  note: >
    The statute's own vocabulary. This already worked, and is here so
    that making the hard queries work cannot quietly break the easy one.

- query: meaning of relative
  doc: family-violence-protection-act-2008
  page: s10

- query: when can police issue a safety notice
  doc: family-violence-protection-act-2008
  page: s26a
  note: >
    Returned nothing at all before, because FTS5 required every word and
    "when", "can" and "a" are words.

- query: who can appeal a family violence order
  doc: family-violence-protection-act-2008
  page: s114

- query: hearsay rule
  doc: evidence-act
  page: s59

- query: privilege against self incrimination
  doc: evidence-act
  page: s128
  note: >
    The Act says "Privilege in respect of self-incrimination"; a lawyer
    says "privilege against self-incrimination". A preposition apart.

- query: meaning of penalty units
  doc: sentencing-act
  page: s110

- query: sentence indication
  doc: criminal-procedure-act
  page: s207

# Typos. Always-on correction is only safe because it fires on words the
# corpus does not contain -- so these must find their targets while the
# queries above keep finding theirs.
- query: famly violence definition
  doc: family-violence-protection-act-2008
  page: s5
  note: A word the corpus does not contain, one letter from one it does.

- query: hearsey rule
  doc: evidence-act
  page: s59

- query: privilige against self incrimination
  doc: evidence-act
  page: s128

# The vocabulary gap, which the entries above do not actually test.
#
# Everything before this point is answered either by words the query and
# the provision share, or by a drafting convention the parser records --
# "Meaning of X" for "definition of X". Those were the failures that
# started this work and they are fixed, which made it look as though
# search was close to solved.
#
# It is not. These are queries where the reader's words and the statute's
# words are simply different: breach for contravention, "how long does it
# last" for "period for which the order is in force", "call a lawyer" for
# "communicate with a legal practitioner". No synonym list scales to
# this, and structure does not help because there is no convention to
# read -- it is what the provision is *about* that matters.
#
# They are here so that the question of whether this corpus needs
# semantic search can be answered with a number rather than an opinion.
- query: what happens if you breach an intervention order
  group: vocabulary-gap
  doc: family-violence-protection-act-2008
  page: s123
  note: >
    Section 123 is headed "Contravention of family violence intervention
    order". Nobody outside a court says contravention.

- query: how long does an intervention order last
  group: vocabulary-gap
  doc: family-violence-protection-act-2008
  page: s97
  note: '"Court may specify period for which order is in force".'

- query: can I call a lawyer after being arrested
  group: vocabulary-gap
  doc: crimes-act
  page: s464c
  note: >
    "Right to communicate with a friend, relative or legal practitioner".
    Not one word of the query appears in the heading.

- query: I was forced to commit the crime by threats
  group: vocabulary-gap
  doc: crimes-act
  page: s322o
  note: >
    Duress. The name of the defence is the one word somebody in this
    position would not know to type.

- query: can a victim tell the court how the crime affected them
  group: vocabulary-gap
  doc: sentencing-act
  page: s8k
  note: '"Victim may make victim impact statement".'

- query: can police take my fingerprints
  group: vocabulary-gap
  doc: crimes-act
  page: s464k
  note: >
    Put here as a control, on the assumption the words line up well
    enough for it to already work. It does not: it is not in the first
    twenty at all, because the heading is weighted above the body and
    Section 464N is headed with the literal phrase "Taking of
    fingerprints". 464K is the one that says a police officer may take
    them.
